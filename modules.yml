    minutes: 100
    core: 70
    extension: 30
    mode: live
    note: "Closes with a ten-minute demo of the group's generative and foundation-model work — which is CS229's newest Part. Real waveforms, not MNIST."
    data: [phasenet_ncedc]
    paper: >
      Zhu & Beroza (2019), "PhaseNet: a deep-neural-network-based seismic arrival-time picking
      method", Geophysical Journal International 216, 261-273. The week reproduces the paper's task
      at classroom scale: same 100 Hz three-component input, same manual P and S labels, smaller net.
    data_status: >
      RESOLVED 2026-08-30, and the earlier obspy scraper is RETIRED. Source is
      gs://quakeflow_dataset/NCEDC/waveform_parquet — already curated, already labelled, no
      station-by-station downloading. tools/make_phasenet_subset.py runs ONCE instructor-side and
      writes data/phasenet_ncedc.npz (~40 MB, ships as a release asset); students load it with
      numpy alone, so the six-library limit holds.
      MEASURED on the built subset: 2,000+ traces, 3 components, 2,048 samples at 100 Hz, all
      finite, 226 stations, 666 events. P index spread 307-921 within the window (a RANDOM offset,
      so the network cannot learn a fixed position). S-P 0.07-11.92 s. First-motion polarity is
      near-perfectly balanced, 951 U / 947 D.
    the_task_is_PICKING, not detection: >
      MEASURED, and it settles which task the week runs on.
      PICKING — the network is NECESSARY. STA/LTA, the classical picker, lands within 0.5 s on
      47-59% of traces depending on its two parameters (median error 0.14-0.70 s; 29% never
      trigger at textbook settings). A small U-Net on the same data reaches 90.8% — that is the
      AUDIT's 47k-parameter net; the shipped classroom net has 3,857 weights and reaches 88.9%.
      That gap is
      real, it is large, and students watch the classical method fail before the network appears.
      DETECTION — decorative, and the week must say so rather than pretend. On raw windows a
      one-line amplitude threshold scores 84.8% and BEATS the CNN on normalised windows (83.9%).
      The "threshold collapses to 50% once normalised" figure is a TAUTOLOGY, not a result: after
      unit-peak scaling the peak feature is identically 1 for every window. Use detection as the
      five-minute warm-up that motivates picking; do not stage it as the network's victory.
      Median post-P/pre-P amplitude ratio is 7.1x (5.9x at 0.5 s, 8.8x full-window) — nothing like
      the 6,587x of the retired scrape, which is why detection is merely easy rather than trivial.
    runs_on_cpu: >
      MEASURED 2026-08-31 ON THE SHIPPED 3,857-weight net. The earlier 1.2 s/epoch was the
      audit's 47k-parameter U-Net and does not describe this notebook. The shipped net trains at
      2.78 s/epoch at torch.set_num_threads(4) — 69.6 s for the 25-epoch class run — and 2.8
      s/epoch at this machine's default of 8 threads; an independent measurement on other
      hardware gave 5.8 s/epoch at the default, so budget 3-6 s/epoch and 1-2.5 min for the class
      run. np.load of the 44 MB file takes 0.21 s. The homework trains three more times (the
      checkpoint's 25 epochs, one sigma at 25, one run of 60), so it is another 110 epochs, 5-11
      min. DataHub CPU is sufficient and Colab is NOT needed for this week — only torch has to be
      in the image.
    data_trap: >
      CLIP THE WAVEFORMS. A handful of traces carry instrument glitches reaching 1e7 std after
      per-component normalisation. They raise nothing: the loss falls, the P channel collapses,
      argmax pins to the window edge, and the net converges to 0.0% within 0.5 s with no error.
      np.clip(w, -10, 10) takes the same network to 90.8% (the audit's net, not the shipped
      one). The builder now clips at write time,
      so a freshly built file is safe; any older copy is not.
    harvest: "offerings/2024-fall_zhu/docs/lectures/09_neural_networks1.ipynb"

