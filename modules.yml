# ─────────────────────────────────────────────────────────────────────────────
# PLAIN WORDS — every DS/ML idea in one sentence, no formal name, no mathematics.
# The plain-words rule made into data: the notebook's closing summary is generated from it,
# and the sentence a student meets in the notebook must be THIS sentence.
plain_words:
  - {idea: "Catalogue completeness", module: P1, words: "A catalogue lists what somebody's instruments recorded, not what happened. Where there are no seismometers there are no earthquakes in the file."}
  - {idea: "Array",                module: D1, words: "A grid of numbers where every cell is the same kind of thing, so one line of arithmetic changes all of them at once."}
  - {idea: "Mask",                 module: D1, words: "Comparing an array with a number asks the same question of every cell at once and hands back a grid of True and False."}
  - {idea: "NaN",                  module: D1, words: "Where the file had nothing at all, pandas puts NaN. A NaN is a hole, not a zero."}
  - {idea: "Table",                module: D2, words: "A table with a name on every column, so you ask for data by name instead of by position."}
  - {idea: "Area weighting",       module: D2, words: "A longitude-latitude grid counts every square once, but a square near the pole is a sliver; weight each row by cos(latitude) before quoting a percentage."}
  - {idea: "Accumulator pattern", module: P3, words: "Set a counter to 0 before the loop starts and add to it inside; same idea for a list — start it empty and append inside."}
  - {idea: "Equilibrium temperature", module: P4, words: "The temperature a planet would sit at if starlight were the only thing heating it and it had no air."}
  - {idea: "Albedo",               module: P4, words: "The fraction of the starlight falling on a world that it reflects straight back into space; only the rest is absorbed and turned into heat."}
  - {idea: "The greenhouse effect", module: P4, words: "The difference between the temperature a world would have with no air and the temperature it actually has."}
  - {idea: "Perceptron",           module: ML6, words: "One weighted sum, squashed into an answer — a single logistic regression, and the piece a network is built out of."}
  - {idea: "Activation",           module: ML6, words: "The bend between two layers. Without it, a stack of straight lines is still one straight line."}
  - {idea: "Loss",                 module: ML6, words: "The one number the network is trying to make small."}
  - {idea: "Epoch",                module: ML6, words: "One pass through all of the training data."}
  - {idea: "Inertia",              module: ML5, words: "The total squared distance from each point to its own pin. It always falls as you add pins, so a small one on its own means nothing."}
  - {idea: "The noise label",      module: ML5, words: "DBSCAN marks a point that is in no crowd with -1. That is not a cluster; it is the algorithm saying it has no opinion about this one."}
  - {idea: "Explained variance",   module: ML5, words: "What share of the spread sits on each new axis. If the first one carries almost all of it, the cloud is really a line."}
  - {idea: "Leakage",              module: ML2, words: "Any route by which information about the data you are scoring on reaches the model before you score it."}
  - {idea: "Polynomial degree",    module: ML2, words: "The degree of a polynomial is how many bends it is allowed: degree 1 is a straight line, degree 2 bends once."}
  - {idea: "Feature importance",   module: ML4, words: "How much of a forest's decisions each column carried — the model's own account of what it used."}
  - {idea: "Missingness as data",  module: ML4, words: "Which measurements are missing is itself a record of who measured the sample, and a model will use it if you let it."}
  - {idea: "Monte Carlo",          module: S2,  words: "Make up a world where the effect is absent, a thousand times, and see how often chance alone beats what you measured."}
  - {idea: "Linear regression",    module: ML1, words: "Draw the best straight line. Best means the smallest total miss."}
  - {idea: "Fit through the origin", module: ML1, words: "Sometimes physics already knows one point on the line. Make the line go through it."}
  - {idea: "Log axes",             module: S3,  words: "When the values span factors of a thousand, plot the exponents instead and a curve becomes a line."}
  - {idea: "Power law",            module: S3,  words: "Every step up in size divides the count by the same factor — which lets you predict the sizes you have never seen."}
  - {idea: "Bootstrap",            module: S4,  words: "Ask the data the same question a thousand times, using a different random slice of itself each time."}
  - {idea: "Confidence interval",  module: S4,  words: "Not one number but the range your number would have wandered over, had the world rolled differently."}
  - {idea: "Overfitting",          module: ML2, words: "A curve that memorises the data you gave it fails on the data you did not."}
  - {idea: "Train/test split",     module: ML2, words: "Hide some data from yourself, then check."}
  - {idea: "Bias-variance",        module: ML2, words: "Too simple and you miss the pattern; too flexible and you memorise the noise."}
  - {idea: "Learning curve",       module: ML2, words: "Watch two lines. When training keeps falling and test turns up, stop."}
  - {idea: "Logistic regression",  module: ML3, words: "The same straight line — but now it outputs a probability between 0 and 1."}
  - {idea: "Naive Bayes",          module: ML3, words: "What does a quarry blast usually look like? Shallow, weekday, mid-afternoon. Score each clue and multiply. Pretending the clues are independent is obviously wrong, and it works anyway."}
  - {idea: "Precision / recall",   module: ML3, words: "Of the ones you flagged, how many were right? Of the real ones, how many did you catch?"}
  - {idea: "Leakage",              module: ML3, words: "You got 99 percent. Be suspicious. Did one of your columns already know the answer?"}
  - {idea: "Baseline",             module: ML3, words: "Write the dumbest rule you can, first. Any model that cannot beat it is decoration."}
  - {idea: "Decision tree",        module: ML4, words: "A flowchart of yes/no questions, learned from the data instead of written by hand."}
  - {idea: "Random forest",        module: ML4, words: "Ask a hundred slightly different trees and take a vote."}
  - {idea: "SVM",                  module: ML4, words: "Of all the lines separating the two groups, take the one leaving the widest gap."}
  - {idea: "Imputation",           module: ML4, words: "A blank is not a zero. Fill it with something defensible and say what you filled it with."}
  - {idea: "PCA",                  module: ML5, words: "If two measurements say nearly the same thing, replace them with one."}
  - {idea: "k-means",              module: ML5, words: "Put k pins on the map, give each point to its nearest pin, move the pins, repeat."}
  - {idea: "DBSCAN",               module: ML5, words: "The same idea, but it is allowed to say: this one belongs to nothing."}
  - {idea: "Neural network",       module: ML6, words: "A stack of the logistic regressions you already know."}
  - {idea: "Gradient descent",     module: ML6, words: "Roll downhill on the error surface."}
  - {idea: "1-D CNN",              module: ML6, words: "Slide a small pattern-detector along the signal."}
