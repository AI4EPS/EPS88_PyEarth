# EPS 88 PyEarth — module catalogue
#
# The catalogue is sized by the MATERIAL, not by the calendar. A given offering
# selects from it (see course.yml); everything not selected is still built and
# published, marked self-study. Modules are stable across years; course.yml is not.
#
# mode:
#   live        must be taught with a person in the room
#   flexible    works either way; a candidate for self-study when the term is tight
#   self-study  reads fine from the book alone
#   distributed not a session; short segments appended to other modules
#   reference   never a session; a page students return to
#   deferred    specified but not built this year
#
# RULE THE CHECKER ENFORCES: a module marked self-study may not be a prerequisite
# of a module taught live. Beginners skip self-study material first, and they are
# exactly the students the Fall 2024 evaluations show were lost.

# `problem:` on a module is the question it was DESIGNED around, kept across years. The term's
# question: in course.yml always wins — a builder reading a week slice sees both, and 18 modules
# carry a problem: that no tool reads. Where they say the same thing, delete the module's.
meta:
  course: EPS 88 — PyEarth
  session_minutes: 100        # of a 120-minute Monday, after setup and transitions
  audience: freshmen, no programming assumed

  # SLACK LIVES INSIDE MODULES, NOT BETWEEN THEM.
  # The 16 live modules fill all 13 Mondays (weeks 2, 3 and 4 each run two), so there is no spare session to
  # absorb a week that runs long — and P3 (loops) will run long for true beginners.
  # Every module is therefore budgeted in two parts:
  #   core       must be taught; later modules may depend only on this
  #   extension  taught if time allows
  # THESE ARE INSTRUCTOR BUDGETS, NOT SECTIONS. Do not label an "EXTENSION" block in the
  # student notebook: it reads as a third category beside class work and homework, and a
  # student cannot tell whether it is theirs to do — it is, everything in the file is graded.
  # The last section carries NO marker of any kind — not a label, not a banner, and not a
  # sentence about possibly not reaching it. See TEMPLATE.md section 1, item 5, which is the
  # single statement of this rule; check_notebook.py fails the build on the old sentence.
  # Nothing later may depend on an extension. The checker does NOT verify this: `requires` is
  # a flat module-level list with no per-section granularity, so it is on you when you build.
  # The 70/30 below is the per-SESSION target. Individual modules are smaller and vary
  # (P1 is 50/25, D1 40/20, D2 30/10) because several Mondays run two modules.
  session_core_minutes: 70
  session_extension_minutes: 30

modules:

  # ---------------------------------------------------------------- Python
  - id: P1
    title: "Notebooks, values, lists — and your first plot"
    topic: "Notebooks, lists"   # docs table label: AT MOST TWO items, and a week with two modules gets one each
    teaches: [jupyter cells, kernel, restart-and-run-all, print, int/float/str/bool, variables,
              arithmetic, f-strings, lists, indexing, slicing, read a CSV into lists,
              plt.scatter and plt.hist — SOMETHING ON SCREEN IN HOUR ONE]
    note: >
      Day one also carries DataHub setup for 46 students. Dicts, JSON and the live API were moved
      OUT of this session: they were the two hardest ideas of the fortnight sitting in the first
      hour. What was bought with the space is a PLOT — a beginner with no visual output has no way
      to tell whether anything worked, and weeks 1-2 previously gave them none.
    requires: []
    harvest_gives: "harvest supplies BOTH the method and the Earth-science content"
    minutes: 75
    note_day_one: "75 min of content; the other 25 of the session is DataHub setup for 46 students."
    core: 50
    extension: 25
    mode: live
    data: [usgs_fdsn_live]
    functions:
      - {name: "print(x)",                 does: "show a value"}
      - {name: "type(x)",                  does: "what kind of value is this", remember: false}
      - {name: "len(list)",                does: "how many items"}
      - {name: "list[i]",                  does: "one item, counting from 0; list[-1] is the last"}
      - {name: "list[a:b]",                does: "a slice — items a up to but not including b"}
      - {name: "max(list) / min(list)",    does: "largest / smallest value"}
      - {name: "list.index(v)",            does: "the POSITION of value v, so you can read the same position out of another list"}
      - {name: "plt.plot(x, y)",           does: "join points with a line — here, the coastline"}
      - {name: "plt.hist(x, bins=n)",      does: "how one list of numbers is spread out"}
      - {name: "plt.scatter(x, y)",        does: "a dot per pair of values"}
      - {name: "plt.xlabel / ylabel / title / show", does: "label it, then draw it"}
      - {name: "round(x, 1)",              does: "trim a long decimal — 9.1 rather than sixteen digits"}
      - {name: "plt.xlim(a, b) / plt.ylim(a, b)", does: "fix how far the map reaches, so the world is always the whole world", remember: false}
      - {name: 'plt.gca().set_aspect("equal")', does: "one degree across = one degree up, so the map is not stretched", remember: false}
      - {name: 'plt.locator_params(axis="y", integer=True)', does: "whole numbers on a count axis — half an earthquake is not a thing", remember: false}
    harvest: "offerings/2023-spring_swansonhysell/Week01_Birthquake_intro/W1_inclass_finding_birthquakes.ipynb"
    harvest_changes: >
      The 2023 notebook is 39 cells, imports pandas ONLY, and draws NO FIGURES AT ALL. What was
      kept: the birthquake question itself, the live USGS query, and the day-one tour of what a
      cell and a kernel are. What changed, and why:
      (1) ADDED PLOTS. The harvest ends with a printed table, so a beginner finishes hour one with
      no way to see whether anything worked. Two histograms and two maps now carry the week.
      (2) ADDED A YEAR OF DATA. The harvest only ever loads one day. A day is a dozen or two events
      and shows nothing; a year is several thousand and draws the plate boundaries outright. The
      contrast is now the closing lesson — same code, more data, a planetary pattern appears.
      THE DEMO DAY IS PINNED in the term's course.yml, chosen for whose birthday it is. Do not
      re-choose it. Before writing the lists section, CHECK WHERE THE MAXIMUM FALLS and build the
      section around the answer: an earlier version of this note demanded the maximum sit at
      neither end, which the pinned day violates — its largest event is also its first, and the
      three that follow are its aftershocks. That turned out to be better material than the rule
      was protecting.
      (3) LISTS INSTEAD OF DATAFRAMES. The harvest indexes a DataFrame from the first minute.
      Here pandas loads the file in a WATCH cell and hands back six plain lists, because P1
      teaches lists and pandas properly belongs to D2.
      (4) ONE WORKED PASS, NOT TWO. The harvest finds the instructor's birthquake and then the
      student's, in full, twice. The second pass is now the homework, which halves class time and
      turns repetition into practice.
      (5) ADDED THE MAGNITUDE-CUTOFF FORK. Not in any prior offering: the same date returns an
      order of magnitude more earthquakes with the floor removed (measured factors of 15-19 on the
      dates tried), which is where catalogue completeness enters the course. Compute the factor for
      whichever date you use; do not quote one from here.
      (6) ADDED SELF-CHECKS after each homework part.

  - id: P2
    title: "Dictionaries"
    topic: "Dictionaries"   # docs table label: AT MOST TWO items, and a week with two modules gets one each
    teaches: [dicts, keys and values, lookup]
    requires: [P1]
