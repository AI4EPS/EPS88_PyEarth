  - id: S2
    title: "Probability and Monte Carlo"
    topic: "Probability, Monte Carlo"   # docs table label: AT MOST TWO items, and a week with two modules gets one each
    teaches: [to_datetime, set_index, resample, rolling, binomial, Poisson, exponential,
              empirical vs theoretical, Monte Carlo simulation FROM AN ASSUMED DISTRIBUTION,
              random seeds, recurrence, 30-year probability]
    note_no_scipy: >
      Distributions are handled with np.random plus counting — which IS the Monte Carlo method
      this week teaches — rather than scipy.stats. One fewer API surface, no content lost.
    not_this_week: >
      Stating uncertainty belongs to S4. S2 reasons FORWARD — assume a model, predict the world.
      S4 reasons BACKWARD — take the data, ask how much the estimate would wobble. S2 ends
      with a point answer (lambda = 0.03/yr, so P ~ 11%); S4 asks where lambda came from,
      bootstraps it, and turns that point into a range.
    functions:
      - {name: "pd.to_datetime(column)", does: "turn a column of date text into real dates, which can be compared and counted"}
      - {name: 'table.set_index("time")', does: "make one column the row labels, so the table knows when each row happened"}
      - {name: 'series.resample("D")',  does: 'regroup a time-labelled series into fixed windows — "D" is one day each'}
      - {name: "series.rolling(365).sum()", does: "slide a window of that many rows along and total what is inside it"}
      - {name: "series.idxmax()",       does: "the LABEL of the largest value — here, the date of the busiest day"}
      - {name: "series.mean()",         does: "the average value"}
      - {name: "column.diff()",         does: "the gap between each row and the one before it"}
      - {name: "column.dt.days",        does: "turn a gap between two dates into a whole number of days"}
      - {name: "np.random.default_rng(seed)", does: "a random-number generator you can reproduce — the same seed gives the same draws"}
      - {name: "rng.integers(low, high, size)", does: "that many whole numbers drawn at random"}
      - {name: "np.percentile(values, 95)", does: "the value that 95 per cent of the numbers fall below"}
      - {name: "np.exp(x)",             does: "e to the power of x — the whole of the Poisson formula"}
      # remember: false — the S2 notebook does NOT use these two, so its summary must not tell a
      # student to remember them; a reviewer found both advertised in a table for a week where
      # they appear nowhere else. They stay DECLARED under S2 because they are drawn from the same
      # generator this module introduces and later weeks reach for them (rng.poisson in the
      # Gutenberg-Richter week, rng.shuffle in the neural-network week and in track T3), so
      # check_prior_knowledge must go on counting them as taught. The week that first WRITES one
      # introduces it in its own prose.
      - {name: "rng.shuffle(a)", does: "put an array in a random order, in place — repeatable from the same seed", remember: false}
      - {name: "rng.poisson(rate, size=n)", does: "draw n counts of rare events at that average rate", remember: false}
      - {name: "series.loc[a:b]",       does: "every row between two labels", remember: false}
      - {name: "series.index.year",     does: "the year of every row label", remember: false}
      - {name: "plt.axhline(y)",        does: "a horizontal line at y, to mark a threshold", remember: false}
    requires: [D1]
    harvest_gives: "harvest supplies the METHOD ONLY — the Earth-science content is new"
    minutes: 100
    core: 70
    extension: 30
    mode: live
    note: "Ends on the probabilistic forecast the course catalogue promises. 'Overdue' is subtle under a memoryless model — the limits are the lesson."
    data: [usgs_fdsn_live]
    harvest: "offerings/2023-spring_swansonhysell/Week06_Probabilities_Geomagnetic_Field/W6_inclass_probability.ipynb"

  - id: S3
    title: "Transformations and feature engineering"
    topic: "Feature engineering"   # docs table label: AT MOST TWO items, and a week with two modules gets one each
    teaches: [why transform before modelling, skewed and heavy-tailed data, why the mean misleads,
              log and log-log axes, linearising a relationship, fitting a line to transformed data,
