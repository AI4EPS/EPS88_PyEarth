  # ------------------------------------------------------------ data stack
  - id: D1
    title: "Arrays — when your data is a grid"
    topic: "Arrays"   # docs table label: AT MOST TWO items, and a week with two modules gets one each
    teaches: [arrays vs lists, shape, reshape, boolean masks, nan, elementwise arithmetic]
    note_distributed: >
      MEASURED across 68 archived notebooks: NumPy is called 741 times but only 26% of that is
      array THINKING (array, arange, linspace, reshape, meshgrid). The other 74% is maths on
      sequences — np.random 118, np.polyfit 40, np.log 28, np.mean 25 — which needs one line at
      the moment of use, not a lesson three weeks early. So np.random is taught in S2
      (Monte Carlo), the sklearn fitting API in ML1 (regression), np.log10 in D4 (log axes).
    functions:
      - {name: "np.array(list)",        does: "the container that does arithmetic to every number at once"}
      - {name: "grid.shape",            does: "how many rows and columns"}
      - {name: "grid.size",             does: "how many numbers altogether"}
      - {name: "grid.ravel()",          does: "lay a grid out flat, as one long line of numbers"}
      - {name: "grid.min() / grid.max()", does: "smallest / largest value in the whole grid"}
      - {name: "grid.sum()",            does: "add every number up — on a mask, that counts the Trues"}
      - {name: "grid.argmax()",         does: "the position of the largest value, not the value itself"}
      - {name: "np.arange(start, stop, step)", does: "evenly spaced numbers — here, the bin edges"}
      - {name: "np.histogram(values, bins=edges)", does: "the counts a histogram would draw, handed back as numbers"}
      - {name: "plt.imshow(grid, extent=[...])", does: "draw a whole grid as a picture, one pixel per cell"}
      - {name: "plt.colorbar(label=...)", does: "the key that says what the colours mean"}
      - {name: "plt.legend()",          does: "name the things on a plot when there is more than one", remember: false}
    requires: [P3]
    harvest_gives: "harvest supplies the method and PART of the content"
    minutes: 40
    core: 30
    extension: 10
    mode: live
    problem: "Why is Earth's elevation bimodal?"   # the distribution lesson and the array lesson are the same lesson
    data: [etopo20, mars_mola_megdr]
    harvest: "offerings/2023-spring_swansonhysell/Week02_Global_Elevation/W2_inclass_Earth_elevation.ipynb"

  - id: D2
    title: "Tables — when your data has named columns"
    topic: "Tables"   # docs table label: AT MOST TWO items, and a week with two modules gets one each
    opening: "First DataFrame is a table of the eight planets — columns a freshman already understands, and it is planetary science. (Idea from Abernathey, unlicensed: framing and NASA public data only.)"
    teaches: [read_csv from a URL, head/info/describe, loc/iloc, boolean filtering, sort_values,
