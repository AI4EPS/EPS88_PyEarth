    note_moved: "to_datetime, set_index, resample and rolling moved to S2, the first module that needs event times."
    functions:
      - {name: "pd.DataFrame(data)",     does: "build a table from values you already have", remember: false}
      - {name: "table.info()",          does: "every column, its type, and how many rows are not blank"}
      - {name: "table.head()",          does: "the first five rows"}
      - {name: "column.isna()",         does: "a mask marking where the file had nothing"}
      - {name: "table.dropna()",        does: "throw away every row with a hole anywhere in it"}
      - {name: "column.value_counts()", does: "how often each value appears"}
      - {name: "table.sort_values(by)", does: "put the rows in order by one column"}
      - {name: "table.groupby(column)", does: "split the table into one group per value"}
      - {name: "column.count() / column.median()", does: "how many, and the middle value"}
      - {name: "table.loc[label]",      does: "read one row out by its label"}
    requires: [D1]
    harvest_gives: "harvest supplies BOTH the method and the Earth-science content"
    minutes: 60
    core: 40
    extension: 20
    mode: live
    problem: "What does a global earthquake catalogue contain?"
