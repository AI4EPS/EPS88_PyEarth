  - id: ML1
    title: "Linear regression"
    topic: "Linear regression"   # docs table label: AT MOST TWO items, and a week with two modules gets one each
    teaches: [least squares, slope and intercept meaning, R squared, residuals,
              sklearn fit/predict/score, forcing a fit through the origin when physics demands it,
              the same modelling decision on a second dataset]
    one_fitting_api: >
      SKLEARN IS THE ONLY ROUTE TO A FIT IN THIS COURSE. Not np.polyfit, even though numpy is
      allowed and polyfit is one line — because fit/predict/score is learned once here and then
      reused unchanged in ML2, ML3, ML4, ML5 and ML6. That is what makes the later weeks read as
      "three more lines" rather than a new idea each time, and it is worth a slightly heavier
      first fit to buy it.
      Forcing through the origin is LinearRegression(fit_intercept=False) — readable, and far
      better than the polyfit trick of appending a fake point at the origin with weight 1e6,
      which a freshman cannot reason about.
      ML2's degree sweep uses PolynomialFeatures(degree=d) with LinearRegression. That is not
      extra machinery: building new columns from old ones IS the feature engineering S3 teaches,
      so the sweep reinforces the earlier week instead of introducing a second fitting idiom.
      np.log10, np.random and np.mean stay in use — the rule is about MODEL FITTING, not numpy.
    functions:
      - {name: "table.tail(n)",         does: "the last n rows"}
      - {name: "column.mean()",         does: "the average of a column"}
      - {name: "LinearRegression().fit(x, y)", does: "find the straight line with the smallest total miss"}
      - {name: "model.coef_[0]",        does: "the slope of the fitted line"}
      - {name: "model.intercept_",      does: "where the fitted line crosses zero"}
      - {name: "model.predict(x)",      does: "what the fitted line says y should be at each x"}
      - {name: "model.score(x, y)",     does: "R2 — the fraction of the up-and-down variation the line accounts for"}
      - {name: "LinearRegression(fit_intercept=False)", does: "the same fit, forced to pass through (0, 0)"}
      - {name: "plt.axhline(y)",        does: "a horizontal line at y, to mark zero on a residual plot", remember: false}
      - {name: "column.abs()",          does: "drop the minus signs, so a miss above and below count the same", remember: false}
    requires: [D1, D2, D4]
    harvest_gives: "harvest supplies BOTH the method and the Earth-science content"
    minutes: 100
    core: 70
    extension: 30
    mode: live
    problem: "How old is the universe?  →  How fast does the seafloor spread?"
