    topic: "Maps"   # docs table label: AT MOST TWO items, and a week with two modules gets one each
    teaches: [lon/lat as an ordinary scatter, plotting boundary lines from a CSV,
              why the data draws its own coastline, what a projection distorts and why]
    functions:
      - {name: 'column.str.startswith("Sub")', does: "a mask marking the rows whose text begins that way"}
      - {name: "np.cos(x) / np.deg2rad(deg)", does: "turn degrees into radians and take a cosine", remember: false}
      - {name: "column.notna()",        does: "a mask marking where the file has a value", remember: false}
    requires: [D4]
    harvest_gives: "no harvest — written from scratch"
    minutes: 50
    core: 35
    extension: 15
    mode: live
    note: >
      CARTOPY DROPPED. It was the only package missing from the DataHub image, which would have
      meant 46 students running %pip install in the mapping session. It is not needed: a plain
      plt.scatter(lon, lat) of 100k epicentres already draws the plate boundaries — the data IS
      the map. VERIFIED: the USGS plate-boundary shapefiles convert to a plain lon/lat CSV using
      the PYTHON STANDARD LIBRARY ALONE (360 segments, 9,853 vertices, 277 KB (ridges 164 / transform 104 / trench 92)), done once by the
      instructor and shipped as a release asset; students plot it with plt.plot().
      What is lost is real projections. What is gained: no install risk, one fewer library, and a
      better lesson — you do not need a map library, the earthquakes draw the coastline for you.
