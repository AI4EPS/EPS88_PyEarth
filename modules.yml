    note_standard: >
      Standard DS topic in the same slot: Data 100 lecture 11 is "Constant Model, Loss,
      Transformations", immediately after simple linear regression, and lecture 15 is
      "Feature Engineering". Feature engineering has never been taught in any EPS 88 offering.
      Gutenberg-Richter and Omori are the APPLICATIONS here, not the topic.
    functions:
      - {name: "np.log10(values)",      does: "the exponent of every value at once — what turns a power law into a straight line"}
      - {name: "array.reshape(-1, 1)",  does: "one row per data point, which is the shape scikit-learn wants"}
      - {name: "table.to_string(index=False)", does: "print a small table without its row numbers", remember: false}
    requires: [S2, P4, ML1]
    harvest_gives: "harvest supplies the METHOD ONLY — the Earth-science content is new"
    minutes: 100
    core: 70
    extension: 30
    mode: live
    problem: "How many M6 earthquakes per decade?  How do aftershocks die away?"
    data: [gvp_live, usgs_fdsn_live]
    harvest: "offerings/2020-fall_swansonhysell/week_05/W5_assignement_richter.ipynb"

  - id: S4
    title: "Uncertainty — bootstrap and confidence intervals"
    topic: "Confidence intervals"   # docs table label: AT MOST TWO items, and a week with two modules gets one each
    teaches: [resampling with replacement, the bootstrap distribution, percentile confidence
              intervals, error bars on a fitted slope, "is this difference real or is it scatter",
              reporting a number with an interval rather than a point]
    functions:
      - {name: "table.sample(n, replace=True)", does: "draw a new table the same size, picking rows at random and putting each back"}
      - {name: "np.percentile(values, [2.5, 97.5])", does: "the two values that cut off the bottom and top 2.5% — a 95% interval"}
      - {name: "np.random.choice(items, size=n, replace=True)", does: "pick n items at random, repeats allowed", remember: false}
      - {name: "pd.concat([a, b, c])",  does: "stack several tables into one, end to end", remember: false}
    requires: [S2, ML1]
    harvest_gives: "harvest supplies the METHOD ONLY — the Earth-science content is new"
    minutes: 100
    core: 70
    extension: 30
    mode: live
    note: >
      THE HOLE THIS FILLS: the project's stated thesis is "a quantified claim with STATED
      UNCERTAINTY" and 15% of its rubric is interpretation_and_uncertainty — yet no session
      taught how to compute one. Data 8 bootstraps means and proportions; this bootstraps a
      FITTED SLOPE, which Data 8 does not reach.
      VERIFIED 2026-08-30. San Francisco sea level, 1,503 monthly means 1900-2025:
      slope 1.96 mm/yr, bootstrap 95% CI [1.87, 2.05] — zero far outside, 20 cm by 2100
      (CI 19-21). Then the same method on S3's earthquake forecast: predicted 1.66 M7+ events
      in 36 years, CI [1.01, 2.50], OBSERVED 5 — outside the interval, so Gutenberg-Richter
      extrapolation is genuinely failing rather than merely unlucky. Every flagship problem in
      this course has a punchline that needs an interval.
    problem: "How fast is San Francisco Bay rising — and could the answer be zero?"
    contrast_with_S2: >
      Same np.random, same histogram, OPPOSITE DIRECTION. Monte Carlo (S2) draws from a
      distribution you assumed: np.random.poisson(lam). The bootstrap (S4) draws from the
      data you have, assuming nothing: data.sample(n, replace=True). Separating them, then returning
      to the same earthquake question, is what makes the difference visible.
