name: check
on:
  push:
    branches: [main]
  pull_request:

# The old repo built the site on push and that workflow was never carried over, so nothing
# validated a push for the first two days of this repo's life. check_all.py is what runs here.
#
# What CI can and cannot see: solutions are gitignored until the Wednesday after each due date,
# and the dataset audits live outside the repo. The checkers degrade to what is present and say
# which checks they skipped — they do NOT fail on an absent file the release policy forbids,
# which is what made all eighteen of the first runs red.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install --quiet pyyaml pandas numpy matplotlib nbformat
      - name: Validate the plan, the checkers, and every built week
        run: python tools/check_all.py

      # A solution notebook must never be on main except by a deliberate release, which is
      # tools/release_solution.py recording the slug in course.yml's policy.solutions_released.
      # The guard reads that list, so releasing a week no longer means editing this file — the
      # previous version of this step could only ever assert "none tracked" and would have gone
      # red on the first Wednesday of the term.
      - name: Only released notebooks are tracked
        run: python tools/check_release.py
