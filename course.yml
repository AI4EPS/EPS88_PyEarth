# ------------------------------------------------------------------ assessment
grading:
  # The weekly notebook carries the course. It is where every method is learned and every
  # Earth-science question is answered, so it holds the weight; the project and the room are
  # each a tenth.
  participation: 10         # observed in the room, NOT a separate upload
  weekly_notebook: 75       # one notebook per week, class work and homework in one file,
                            # submitted once. The lowest is dropped (policy.drop_lowest).
  project: 15               # presentation 5 + notebook 10; there is no proposal gate

policy:
  exercise_due: "Sunday 23:59"
  drop_lowest: 1            # lowest weekly notebook dropped; docs/ read this, never hardcode it
  solution_release: "the following Wednesday"
  solution_rationale: >
    A two-day accommodation extension ends Tuesday, so a Wednesday release never collides with it,
    and the reader window is a fixed Wednesday–Sunday.
  late: "10% per day; nothing accepted once solutions post"
  # No separate day cap: solutions post the Wednesday after the Sunday due date, so the
  # release IS the cutoff. A second number here could only drift out of step with it.
  # AI use is NOT published in docs/. Two drafts of a student-facing policy were written and both
  # over-claimed — they described controls the course does not actually have. There is no honest
  # short version yet, so the syllabus says nothing rather than something untrue; write the real
  # policy when you have decided what it is. What holds for building notebooks either way:
  #   * a weekly notebook carries NO AI-disclosure cell (tried, removed — nobody read it)
  #   * the FINAL PROJECT does: project.required_of_every_project.ai_disclosure

project:
  question_shape: "From this data, make a quantified claim with stated uncertainty, and say how much to trust it."

  required_of_every_project:
    - baseline_first: >
        State a TRIVIAL baseline before any model: predict the majority class, or the mean.
        Every model is reported against it. One line of code, and it is what stops a student
        being impressed by 98% accuracy — which is exactly what "always say earthquake" scores
        on the week-10 data. (Design idea from GeoSMART MLGeo, MIT.)
    - split_by_structure: >
        Do NOT split a time series at random. Earth data are correlated in space and time, so a
        random split puts tomorrow in the training set and yesterday in the test set, and the
        score is a lie. Split by time, or by region, and say which you chose and why. This is the
        single most common beginner error in Earth-science ML. (Also from MLGeo.)
    - one_sentence_answer: "The claim and its uncertainty, in one sentence, at the top."
    - what_i_got_wrong: "A section on what failed. Honest failure is graded; a faked success is not."
    - ai_disclosure: "Tool, prompt, what you changed, and how you verified it."

  track_notebooks: >
    A track ships as a NOTEBOOK, authored to TEMPLATE.md like any week. It differs from a weekly
    notebook on exactly two axes: LESS HELP, and IT DOES NOT CLOSE.

    LESS HELP — the scaffolding starts where a weekly notebook ends.
      * NO "WATCH" cells. By week 10 nobody needs to be shown a cell being typed.
      * The notebook gives them the data LOADED and the known result REPRODUCED — that far and no
        further. That part exists only so they trust the pipeline before they change it.
      * Everything after that is "YOUR TURN": a prompt in words, an empty cell, no worked template
        to pattern-match against. A weekly notebook runs worked -> guided -> solo; a track notebook
        starts at solo.
      * Asserts ONLY on the data-loading step (row counts, shapes). Downstream there is no single
        right answer, so a self-check would be a lie about how research works. This is the one
        place the course deliberately withdraws the safety net, and students should be told that.

    IT DOES NOT CLOSE — a weekly notebook ends with the answer in one sentence. A track notebook
    ends with a named OPEN QUESTION the course does not know the answer to. The verified half is
    scaffolding; the open half IS the project. If a track has no genuine open question it is not
    ready to ship, and the checker enforces that every track carries one.

    The five required_of_every_project items appear as EMPTY headed sections in the notebook, so
    the structure of a good answer is visible even though none of the content is.

  # Design notes for the flagship weeks now live ON their week in `schedule:`, under
  # `flagship:` — a week's builder reads that week's entry and nothing else, so anything filed
  # anywhere else is invisible to the person who needs it.
  # What makes a flagship problem: a famous or gripping question; tiny clean data; ONE genuine
  # modelling fork where defensible choices give different answers; and a way to CHECK the answer.
  #
  # Dataset shapes, spans, read recipes and traps are NOT recorded here — they live in
  # notes/dataset-audit/, which is measured rather than remembered, and each week cites its own
  # through `evidence:`. A `vetted_datasets:` list used to sit here and had drifted out of date.

  tracks:
    # Each is a notebook. Verified numbers and read recipes live in the evidence file; keep the
    # entry here to the shape of the project — what it asks, the one real choice, what is unknown.
    - id: T1
      field: seismology / engineering
      title: "How hard will the ground shake at distance R from a magnitude M earthquake?"
      data: >
        ESM (Engineering Strong Motion) flatfile service, https://esm-db.eu/esmws/flatfile/1/query
        — no login, no token, and pd.read_csv(url, sep=";") is the whole read recipe.
        54,179 records, 4,869 events, 3,165 stations, 65 countries, M 2.6-8.4, R 0-736 km,
        PGA to 1.226 g. Vs30 on 70% of rows, EC8 site class on 96%.
        (PEER NGA-West2 is the canonical database and is unusable here: it returns 403
        unauthenticated and no open mirror exists.)
      fork: >
        How do you split train from test? Random, by event, by station, or by region. The four
        give different answers and only one of them is honest — many records share an earthquake,
        and many share a station.
      open_question: >
        Does a neural network actually beat a well-designed parametric GMPE, or does it only look
        that way under a random split? Measured on this data, a random forest beats the classic
        three-parameter form by +0.061 R2 on a random 5-fold, +0.056 split by event, LOSES by
        0.012 split by station, and loses by 0.054 trained outside Italy and tested in Italy.
        The advantage reverses sign, because the forest was memorising site terms rather than
        learning physics. Whether ML genuinely improves ground-motion prediction under honest
        validation is unresolved in the literature and decidable with this dataset — and sigma
        (0.448 log10, decomposing to tau = 0.371 and phi = 0.337) is the quantity seismic hazard
        actually consumes, so reducing it is a real goal rather than a leaderboard.
      uses: [ML1, S3, S4, ML2, ML4, ML6]
      evidence: notes/dataset-audit/ground-motion.md

    - id: T2
      field: climate
      title: "Is the CO2 seasonal cycle getting stronger?"
      data: "NOAA Mauna Loa monthly 1958-2026, plus Barrow at 71N for the comparison"
      fork: "What is 'amplitude' — peak-to-trough, detrended residual, or a Fourier term? They disagree."
      open_question: >
        Mauna Loa gives +12.9% and Barrow gives +24.7%: the seasonal breath is growing faster at
        high latitude. How far north does that scale, and what does it say about which ecosystems
        are doing the breathing?
      uses: [ML1, S4, ML2]
      evidence: notes/dataset-audit/noaa-climate.md

    - id: T3
      field: volcanology / data provenance
      title: "July has 400 eruptions and March has 250. Is that the Earth, or the catalogue?"
      data: "Smithsonian GVP, 2,977 eruptions since 1950 carrying a month, live"
      fork: >
        Which records do you trust? When only the year is known GVP writes a real-looking 2 July
        and flags it in a column nobody reads. That placeholder is most of the excess.
      open_question: >
        Cleaned of placeholders, chi2 = 20.9 against a 19.7 critical value — but the 2,480
        eruptions come from only 364 volcanoes, and a volcano-block bootstrap spreads the statistic
        across 14.0 to 59.0. Could a real seasonal signal ever be detected in a catalogue like this?
      uses: [S2, S4, D2]
      evidence: notes/dataset-audit/gvp-volcanoes.md

    - id: T4
      field: planetary science
      title: "Are we finding more Earth-like planets, or just better telescopes?"
      data: >
        NASA Exoplanet Archive, the `ps` table with default_flag=1. NOT `pscomppars` — both return
        6,354 rows, which is how they get confused, but only `ps` carries measured values.
      fork: >
        Which planets can you honestly compare? Radial velocity measures a minimum MASS, and only
        31 RV planets have a measured radius; the rest are inferred through a mass-radius relation.
        Comparing those to transit radii compares a model's output to data.
      open_question: >
        Every instrument has shown us a different galaxy — Kepler small and far, TESS bright and
        near. What does the REAL population look like? Transit probability goes as 1/a and is
        computable from the columns present, so a defensible bias correction is within reach.
      uses: [D2, ML1, ML2, ML5]
      evidence: notes/dataset-audit/exoplanet.md

    - id: T5
      field: oceanography / hydrology
      title: "Does El Nino really bring rain to California?"
      data: "NOAA Nino 3.4 1948-2026 plus USGS discharge; 234 natural CA gauges have 50+ years"
      fork: "Which river — and which water year? The contrast survives Oct-Sep but collapses under a calendar year."
      open_question: >
        The signal is strong in the south (r = +0.36) and absent in the north (+0.087); the paired
        bootstrap on the difference gives +0.222, CI [+0.039, +0.398]. WHERE does it switch off,
        and is the boundary sharp or gradual? Every student takes a different gauge, so the class
        assembles a map no single project could produce.
      uses: [ML1, S4, ML3]
      evidence: notes/dataset-audit/noaa-climate.md

    - id: T7
      field: petrology / machine learning
      title: "Can you tell where a basalt erupted from its chemistry alone?"
      data: "Vermeesch 2006, 756 samples, OIB 259 / IAB 256 / MORB 241"
      fork: "Which chemistry — the classic three-element diagram, the ten major oxides, or all 51 columns?"
      open_question: >
        The forest leans hard on Sr and K2O, which the published discrimination diagrams
        deliberately avoid as alteration-mobile; adding Sr to the classic trio jumps accuracy from
        81.2 to 89.7. Are the classic diagrams trading discrimination for robustness, and is that
        the right trade for a rock that has sat on the seafloor for 50 million years?
      uses: [ML4, ML2, ML5]
      evidence: notes/dataset-audit/vermeesch-basalts.md

    - id: T8
      field: seismology / machine learning
      title: "Which way did the ground first move — and can a machine tell?"
      data: "data/phasenet_ncedc.npz — 2,500 traces, polarity labels 1,233 U / 1,115 D"
      fork: "How much waveform around the pick do you give the model?"
      open_question: >
        A one-line physics rule — the sign of the first sample after the pick, relative to the
        pre-pick mean — already scores 0.828, and the CNN reaches only 0.843. So the project is not
        "can a network do this" but "why does the network barely beat one line, and what would it
        take to do better?" The window sweep is the evidence: 0.1 s gives 0.846 and 10 s gives
        0.777, a monotone decline, because polarity lives entirely in the first swing and
        everything after it is noise. Roughly 10% of the labels are irreducibly wrong (the sign of
        the first swing disagrees with the analyst 17.5% of the time, plateauing near 0.89 even on
        the clearest arrivals), so every model lands at 0.81-0.85 — AT THE CEILING. Is the
        remaining gap model capacity, or is it the labels? Deciding that is the project.
      uses: [ML3, ML6]
      evidence: notes/dataset-audit/ncedc-phasenet.md

    - id: T6
      field: student's choice
      title: "Your own question"
      open_question: "EXEMPT — the student supplies the open question; that is what T6 is."

  teams: "1–3"
  requires: {modules_used: 2, visualisation_types: 3}
  coverage_rule: >
    Do not assume the tracks split into "statistics" and "machine learning" — they do not, and an
    earlier version of this rule said so wrongly. Read each track's `uses:`. T3 is the only purely
    statistical one; T1 reaches furthest, from a straight line to a neural network, and T4, T5 and
    T7 all end in a classifier or a clustering step.
    Whatever a project uses, it must name the METHOD FAMILY and say why the question needs it. The rubric's 25 points for method choice reward fit, not sophistication:
    a justified chi-squared beats an unjustified neural network.
  choose: >
    Pick one of the prepared track notebooks, or bring your own question. There is nothing to
    propose and no spec to wait for — the track notebooks ARE the spec, and they are published
    from the start of the term so a student can read ahead. A student bringing their own question
    shows the instructor data already loaded AND PLOTTED before committing to it; that is the only
    gate, and it exists because a question with no working data is not a project.
  talks: 2026-12-07          # RRR Monday, lightning talks
  due: "2026-12-16 23:59"
  rubric:
    question_and_motivation: 15
    data_handling: 20
    method_choice_and_correctness: 25
    visualisation: 15
    interpretation_and_uncertainty: 15
    reproducibility_disclosure_and_what_i_got_wrong: 10
  note: >
    The rubric rewards appropriate method choice, not fancy: a neural network on 50 points loses
    marks that a justified straight line earns.
