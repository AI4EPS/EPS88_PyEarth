        # (the 80 median-filled test rocks score 0.675, the 147 measured ones 0.755); the other
        # 0.077 is the split. Refitting on the complete training rows only and scoring the same
        # 147 measured test rocks gives 0.762 against 0.755 — training on filled rows is not the
        # cause of anything.
        ti_v_dropna_vs_filled:
          seed0: {dropna: 0.832, filled: 0.727}
          ten_splits: {dropna_mean: 0.780, filled_mean: 0.726, gap_mean: 0.054, gap_min: 0.001}
          filled_model_test_set: {measured: [147, 0.755], median_filled: [80, 0.675]}
        # TiO2 alone on those same 514 rows and the same split scores 0.735 and V alone 0.303:
        # vanadium buys 0.097, so "vanadium adds very little" is false, however it looks on the
        # scatter (the three class medians of V sit within 18.5 ppm of each other).
        ti_v_one_element_at_a_time: {TiO2_only: 0.735, V_only: 0.303, both: 0.832}
      verified: 2026-08-31
    exercise: >
      Train a forest on the ten major oxides, then on all 51 columns. More columns wins — 0.965
      against 0.921 — and the obvious reading, that the sparse trace elements carry real signal,
      is WRONG and measurably so: the 19 mostly-empty columns hold 0.097 of the forest's
      importance and the best ranks 24th, while a forest handed ONLY the pattern of blanks, no
      measurement at all, scores 0.868 against a 0.343 baseline. Much of the advantage is the
      compilation remembering which study each sample came from — week 9's leakage, arriving in
      a week that did not go looking for it. Then delete the imputer and use dropna() instead:
      the ten oxides leave 271 rows, all 51 leave exactly 1. Say which number you would report
      to a geochemist, and what you would have concluded from the win alone.
    note: >
      The old version of this exercise asked students to explain "why more data made it worse".
      It does not: all 51 columns beat the ten major oxides by 5.2 points (96.06 against 90.89,
      50 fits, p = 8e-23), and the 19 columns that are over half empty reach 79.8% ON THEIR OWN.
      No column in the file is complete — Sr, the best, is 6.5% missing — so the honest version of
      "more columns destroyed it" is about DELETION, not dimensionality: dropna() on all 51 leaves
      a single row. That keeps the intended lesson, makes it dramatic, and teaches imputation,
      which is the skill the week actually needs.
      By now each new classifier is three lines behind the same sklearn API, not a new idea —
      which is what buys the room to spend this week on missingness instead of on syntax.
    evidence: [notes/dataset-audit/vermeesch-basalts.md]
    takeaways:
      - "A rock's chemistry carries the tectonic setting it formed in."
      - "Missing data is not useless data — a half-empty column can still carry real signal, and even the pattern of the blanks predicts the setting."
      - "Deleting rows to avoid missing values can destroy a dataset entirely."
