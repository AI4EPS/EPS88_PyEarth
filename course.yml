# EPS 88 PyEarth — Fall 2026 offering
#
# This file is THIS TERM'S selection from modules.yml, plus dates and policy.
# Re-planning a semester edits this file; it never edits a notebook.
# docs/README.md, docs/syllabus.md and the mkdocs nav are all generated from here.

term: Fall 2026
instructor: Weiqiang Zhu <zhuwq@berkeley.edu>
meeting: "Mondays 12:00–2:00 pm, McCone 265"
units: 2
enrollment_cap: 46
catalog_line: >
  One question a week, answered with data and code you write yourself. Where do earthquakes and
  volcanoes happen, and why there? Which worlds besides Earth could hold liquid water? Is carbon
  dioxide rising faster than it used to? Can a machine learn to hear an earthquake?


  The datasets are the ones research uses, not simplified teaching examples: the USGS earthquake
  catalogue, NASA's Exoplanet Archive, the Smithsonian's record of volcanic eruptions, and the
  seismic recordings used to train published deep-learning models. Python begins from zero in the
  first week, which ends with a figure you have plotted yourself, and reaches a neural network in
  the last. In between you learn to fit a model to data, to state how far it can be trusted, and
  to distinguish a real result from a coincidence. Thirteen notebooks, then a project of your own.
prerequisites: >
  None. No programming experience is assumed — we build Python from zero. EPS 88 is a Data 8
  connector; students who have taken Data 8 will recognize some of the statistics and move faster,
  but nothing here requires it.

platform:
  primary: DataHub          # nbgitpuller; students work in personal copies
  datahub: "https://datahub.berkeley.edu"
  repo: "https://github.com/AI4EPS/EPS88_PyEarth"
  branch: main
  notebook_dir: docs/notebooks
  cache_base: "https://raw.githubusercontent.com/AI4EPS/EPS88_PyEarth/main/data"
  cache_note: >
    Every live-data cell needs a cached fallback, and this is where it lives: a CSV committed to
    data/ on main, read from cache_base. Small CSVs only. A LARGE binary (the week-13 waveform
    array, 42 MB) goes to a GitHub release instead, because nbgitpuller clones this repo onto 46
    student accounts and the fallbacks must stay cheap: see the data-v1 release. A fallback CSV is
    NOT a release asset — that needs a release step nobody
    will remember. The cache is written by the week's build script and MUST BE PUSHED BEFORE THE
    NOTEBOOK IS RELEASED; until then the fallback path 404s and is untested. The reason for the
    fallback is campus-side network failure with no graceful degradation, not a server limit.
  gpu_fallback: Colab
  # THE ONLY LIBRARIES STUDENTS EVER IMPORT
  libraries: [python, numpy, pandas, matplotlib, scikit-learn, pytorch]
  dropped:
    cartopy: "Replaced by two pre-converted lon/lat CSVs read with pandas — data/coastlines.csv on every map, plus plate boundaries where a week needs them. Was the only package missing from the DataHub image."
    scipy:   "curve_fit replaced by linearising and fitting with sklearn; scipy.stats replaced by np.random and counting."
  packages_needed_not_in_image: [torch]   # week 13, and tracks T1 and T8 (T7 is trees, no torch)
  gpu_note: >
    The taught week-13 exercise does NOT need a GPU, but budget more than the old note claimed.
    It said 1.2 s/epoch and "about 31 s for 25 epochs"; that was measured on the audit's
    47k-parameter U-Net, not on the 3,857-weight network the week actually ships. Measured on
    the shipped one (2026-08-31): 2.76 s/epoch with torch.set_num_threads(4) — 2.4 s training
    plus 0.35 s for the per-epoch held-out evaluation — so about 69 s for the class cell, and
    5.8 s/epoch at the default thread count. Your turn 8 runs 60 epochs, so roughly 165 s more,
    and about five minutes of compute across the homework. Nobody is blocked, but the class cell
    is a minute rather than half a minute, and that is worth knowing before the room waits on it.
    MEASURE IT ON DATAHUB before the class rather than trusting either number.
    Colab stays as the fallback for going FURTHER: a bigger network, more epochs, and the project
    tracks that train repeatedly rather than once (T8's window sweep alone is several runs).
    Plan the session for CPU; point students at Colab if they take a project further.
calendar:
  instruction: [2026-08-26, 2026-12-04]
  no_class: [{date: 2026-09-07, reason: Labor Day}]
  rrr: [2026-12-07, 2026-12-11]
  finals: [2026-12-14, 2026-12-18]

# ------------------------------------------------------------------ schedule
# How a homework is designed, and why the student notebook is derived from the solution rather
# than copied from the class one, are TEMPLATE.md §4 and §7 — stated there once. What belongs
# here is only each week's own `exercise:`. There is no "lecture": the class cells are the
# student's graded work too, and Earth-science breadth comes from the weekly questions.
#
# Each Monday runs one session of ~100 teaching minutes: a module's CORE (~70 min)
# plus its EXTENSION (~30 min) if the pace allows. A slow week converts that
# module's extension into assigned reading — it is written and published either way.
schedule:
  - n: 1
    frozen_until: 2026-09-09        # the Wednesday after week 1's deadline
    frozen_because: >
      Taught 2026-08-31. 46 students hold this notebook, nbgitpuller gives their copy priority
      on a merge, and the deployed Gradescope bundle stores its released self-checks — so any
      change to an assert, a cell id or the released source fails whoever is on the other side
      of it. The repaired week is built and waiting on branch week01-v2; it merges on the date
      above. Until then check_all REPORTS week 1's defects and does not fail on them, so a red
      build still means something new broke. Delete both keys at merge.
    date: 2026-08-31
    slug: 01_birthquake
    evidence: [notes/dataset-audit/usgs-fdsn.md]
    modules: [P1]
    field: seismology
    question: "What was your birthquake?"

    # PINNED — do not re-choose these, and do not go measuring years to pick a better one.
    # The class runs on ONE shared birthday so every printed number is the same on 46 screens;
    # the student's OWN birthday is the homework. See note_dates below for why these three.
    pinned:
      demo_person: "Aaron Rodgers, Cal quarterback"
      demo_day: 1983-12-02      # 14 events at M4.5+; birthquake is M7.0 S of Champerico, Guatemala
      demo_year: 1983           # 4124 events. CUMULATIVE ratios 9.1 (4124/451) and 8.5 (451/53) —
                                # that is the pair to teach: three counts and two divisions, which is
                                # all a week-1 student can build. Do NOT quote incremental bin ratios:
                                # FDSN maxmagnitude is INCLUSIVE, so minmag=4.5&maxmag=5.5 next to
                                # minmag=5.5&maxmag=6.5 counts every M5.5 twice. An earlier version of
                                # this line said 9.2 and 7.8; both came from that double count.
      completeness_day: 1940-10-03   # Walter Alvarez's birthday — ONE earthquake in the catalogue
      completeness_year: 1940        # 236 events all year (against 4124 in 1983 — 17.5x, not
                                     # "forty", which an earlier draft of note_dates claimed), and
                                     # INVERTED: the catalogue lists more mid-sized than small
      # The homework says "your own birthday", so the SOLUTION has to work one concrete case.
      # Use a plausible student birthday: a Fall-2026 freshman is 18, born Sep 2007 - Aug 2008.
      # Never the demo day, and never a date the class already loaded.
      homework_example_day: 2008-03-12   # 15 at M4.5+, 301 with no floor, smallest M-0.5,
                                         # birthquake M6.4 52 km S of Lakatoro, Vanuatu
      # The spans homework part 3 maps, and the counts its model answer quotes. These were in the
      # notebook and nowhere in the plan, so a rebuild would have had to re-measure them.
      homework_example_spans: {day: 15, week: 100, month: 546}
      # Section 6 asks whether one year can carry a ratio, and answers it by widening the window.
      # Every span it queries is pinned here: a rebuild from this file must reproduce the same
      # numbers, and these were missing until a reviewer went looking for them.
      ratio_windows:
        neighbour_years: [1982, 1984]      # M7.5+ counts 0 and 2, against 1983's 1
        decades: [[1980, 1990], [1990, 2000], [2000, 2010], [2010, 2020]]
        # M6.5+/M7.5+ = 19.9 / 11.6 / 7.8 / 8.9 — the 1980s is the OUTLIER, and saying so is the
        # lesson. An earlier build read its 19.9 as physics and concluded the rule is "loosest at
        # the top of the scale"; it is not.
        fifty_years: [1976, 2026]          # 2192 at M6.5+, 218 at M7.5+, ratio 10.1
        fifty_year_start_note: >
          1976 is where the modern moment-magnitude catalogue is usable, and the notebook calls it
          "fifty years" without justifying the start. If a future build wants to justify it, that
          claim must be computed, not asserted.
    note_critical: >
      The demo person must be born after ~1973. Measured with the CUMULATIVE ratio this week
      teaches, N(M4.5+)/N(M5.5+): 1942 gives 1.12, 1964 gives 1.28, 1970 gives 1.41 — barely above
      one, because before the global network almost every small earthquake is missing and the
      catalogue is nearly all large events. 1975 gives 7.96, 1983 gives 9.1. (An earlier draft said
      those years "list more large earthquakes than small" and quoted 0.3 and 7.7; both came from
      INCREMENTAL bins, which the pinned block above bans. Under the taught ratio no year is
      inverted — they are merely starved.) That rules out every famous Berkeley name —
      Alvarez 1940, Oppenheimer 1904, Lawrence 1901, and every Berkeley Nobel laureate, all born
      in the inverted zone. It is also why 1983's ratios are 9.1 and 8.5 rather than a suspiciously
      textbook ten: the year was chosen for whose birthday it is, NOT for its ratios. Teach the
      measured numbers against the rule of thumb; do not hunt for a year that agrees better.

      Walter Alvarez is in the notebook anyway, as the completeness moment rather than the demo:
      the Berkeley professor who showed an asteroid killed the dinosaurs was born on a day the
      catalogue says had ONE earthquake, in a year it says had 236 — against 4124 in 1983. Ask
      whether the planet got seventeen times busier or we got better at listening. One cell, and it
      carries takeaway 2 further than any amount of prose.

    exercise: >
      Three parts, on the student's OWN birthday, each serving a different takeaway.
      (1) YOUR OWN BIRTHQUAKE, then your own count — ONE task, because it is one load of one day.
      Load your birthday and print your birthquake (magnitude, place, depth) with the same max()
      and .index() move class used on the demo day; the week is called "What was your birthquake?"
      and a student must not finish it knowing only somebody else's. Then, from the SAME day with
      the magnitude floor removed entirely, how many earthquakes there were, against a guess
      committed before looking. The birthquake is the warm-up that proves the load worked; the
      count is the question. TEMPLATE's "one task per part" is about not stacking unrelated asks,
      and these are two prints off one dataframe. Serves takeaway 2 and catalogue completeness.
      (2) The fork: extrapolate the ten-to-one rule down from M4.5 to predict that total, and
      report how far off it is. Serves takeaway 2.
      (3) How many days of data do you need before the plate boundaries appear? Map your birthday,
      your birth week and your birth month, and say which is the first span where the lines show
      rather than scattered dots — with the earthquake count that took. No single right answer;
      a defensible one with a number attached. Serves takeaways 3 and 1, which class raises and
      nothing else at home tests.

    takeaways:
      - "Earthquakes trace narrow lines, and those lines are the edges of the tectonic plates."
      - "Small earthquakes outnumber large ones by roughly ten to one per magnitude step — check it yourself, and say where the count gets too small to trust the ratio."
      - "How much data you need is a scientific question: one day showed nothing, a year drew the planet."
  - n: 2
    date: 2026-09-14
    slug: 02_liquid_water
    modules: [P3, P4]
    field: planetary science
    question: "Which of these worlds could have liquid water — and why does your test reject Earth?"

    pinned:
      # From the week note and notes/dataset-audit/exoplanet.md. THE CACHE IS AUTHORITATIVE
      # for prose numbers: `default_flag=1` returns whatever the archive holds that day.
      slice: "NASA Exoplanet Archive TAP, select ... from ps where default_flag=1 — 6354 rows, of
        which 3101 carry st_teff, st_rad and pl_orbsmax so T_eq can be DERIVED"
      constants:
        T_sun_K: 5772            # IAU 2015 nominal
        R_sun_AU: 0.00465047
        albedo: {earth: 0.306, venus: 0.770, mars: 0.250}
        albedo_note: "Earth 0.306 is the SELF-CONSISTENT value, not a reading: the sheet prints
          0.294 and has since at least 2025-08-21, but 0.294 gives a black-body temperature
          of 255.13 K while the sheet's own black-body row says 254.0 — which only 0.306
          reproduces (254.04). Do NOT tell students 0.306 was read off the page on a date
          when the page said 0.294. Quote ONE albedo
          per week and check every number that hangs off it moves with it."
        surface_T_K: {earth: 288.0, venus: 737.0, mars: 214.0}   # Mars CORRECTED 2026-08-31
        surface_T_note: >
          Mars was pinned at 210, which made its greenhouse effect 0.2 K and was quoted
          three times in the week as "too small to see". The NSSDC Mars fact sheet says
          "Average temperature: ~214 K (-59 C)", so the real figure is 214.0 - 209.8 =
          4.2 K, and 0.2 K was an artifact of a surface temperature that happened to equal
          the black-body one. Two builders disagreed about this and the disagreement was
          closed by RECOMPUTING from the pinned 210 — which only ever proved the
          arithmetic self-consistent, never that 210 was what the source said. Nobody
          opened the page until a reviewer did. The lesson survives at 4.2: the greenhouse
          effect still tracks pressure across three decades, 4.2 << 34.0 << 510.3.
      expect:
        T_eq_at_measured_albedo: {earth: 254.0, venus: 226.7, mars: 209.8}
        T_eq_at_albedo_zero: {earth: 278.3, venus: 327.3}
        in_window_273_373: 189   # of which 12 rocky, 75 too big, 102 unknown radius
        agree_with_pl_eqt: "median 2.56 K, mean 40.4 K, 62% within 10 K — quote the median"
      verified: 2026-08-30
    exercise: "Run your function on every planet that has the numbers to support it. Then change the albedo to Venus's and widen the window, and report how many worlds move in and out. Then name one planet your test calls habitable that you do not believe, and say what the test is missing."
    note: >
      THE TEST NEVER GETS IT RIGHT, AND THAT IS THE WEEK. Equilibrium temperature ignores
      atmospheres, and the failure is not one-sided — run it twice and it is wrong both times.
      With albedo 0 it ACCEPTS both Venus (327.3 K) and Earth (278.3 K). With each planet's
      measured Bond albedo it REJECTS both: Venus 226.7 K, Earth 254.0 K, nineteen degrees below
      freezing. Reality is Earth 288 K and habitable, Venus 737 K and not.
      Do not state it as "Earth fails while Venus passes" — that sentence is only true by mixing
      Earth's measured albedo with Venus at zero, and it was in this file for a while. Run both
      passes in sequence; the reveal is stronger honest.
      The gaps are the greenhouse effect, measured: Earth +34.0 K at 1.014 bar, Venus +510.3 K at
      92 bar, Mars +4.2 K at 0.006 bar (was +0.2 K while Mars was mispinned at 210 K). Same physics, three thicknesses of air. It also rejects the famous habitable-zone candidates — TRAPPIST-1 e,
      f and g, Proxima Cen b, TOI-700 d, Kepler-186 f, Kepler-442 b — and accepts TRAPPIST-1 c,
      a 340 K Venus analogue, and K2-18 b, a sub-Neptune.
      Build toward that reveal: they write the test, trust it, then run it on Earth. The 34.0 K
      Earth gets from its atmosphere and the ~500 K Venus gets from its own is the greenhouse
      effect arriving as a measured discrepancy rather than a definition, and it is the cleanest
      possible setup for the CO2 weeks later in the term.
      The fork is real and not knife-edge: rocky candidates move 6 -> 27 across defensible albedo
      and window choices, with a stable core of 9 surviving at least 6 of 8 variations.
      USE ALBEDO 0.306 FOR EARTH, the cited NASA Bond value, which is what gives the 254.0 K above.
      An earlier version of this note paired 254.0 K with "6 -> 26"; those need DIFFERENT albedos —
      0.300 (the audit's grid row) gives Earth 254.6 K and 26 worlds, 0.306 gives 254.0 K and 27.
      Verified this session. Quote one albedo throughout a week, and check every number that hangs
      off it moves with it.
      THE CACHE IS AUTHORITATIVE FOR THE PROSE. `default_flag=1` returns whatever the archive
      holds on the day, so there is no date to pin, and this week hardcodes about eleven numbers
      into markdown. Write those from data/week02_exoplanets.csv, not from a fresh query, and
      re-cache deliberately rather than by accident.
      DATA: `select ... from ps where default_flag=1` gives 6,354 rows, 3,101 of which carry
      st_teff, st_rad and pl_orbsmax so T_eq can be DERIVED rather than read from a column.
      Against the archive's own pl_eqt the median difference is 2.56 K but the mean is 40.4 K and
      only 62% agree within 10 K — quote the median. SHIP A CACHED CSV: the TAP service failed 4
      of 16 test requests — a 25% single-attempt failure rate, with stalls of 25, 36 and 60 s —
      and pd.read_csv has NO timeout, so a stall hangs a student's kernel silently, with no error
      and no way to tell it apart from slowness.
    evidence: [notes/dataset-audit/exoplanet.md]
    takeaways:
      - "Equilibrium temperature ignores atmospheres: run the test one way and it accepts Venus alongside Earth, run it the other and it rejects both. It never gets the answer right."
      - "The greenhouse effect arrives as a measured discrepancy, not a definition."
      - "A function is a question you can ask many times without retyping it."
  - n: 3
    date: 2026-09-21
    slug: 03_two_peaks
    evidence: [notes/dataset-audit/elevation-grids.md]
    modules: [D1, D2]
    field: planetary science / oceanography
    question: "Earth's elevation has two peaks. So does Mars's. Same reason?"

    pinned:
      # BOTH GRIDS ARE PRE-BUILT, and this is a decision the plan makes, not the builder.
      # The sources are unusable as they ship: Earth is 15 MB of ASCII at a LOCAL path in
      # offerings/ with no URL (TEMPLATE forbids local paths), Mars is big-endian int16 with a
      # detached PDS label that no week-3 student could read with the six libraries — and its
      # server fails certificate verification from Python. tools/make_elevation_grids.py
      # resamples both to 1 degree and writes plain CSV; students never touch PDS.
      slice: "data/earth_elevation.csv and data/mars_elevation.csv — (180, 360) each, 1 degree,
        ~330 kB each, integer metres, no header. BOTH SHIP ALIGNED in one convention: row 0 is
        the northernmost band (Arctic, mean -3661 m), row 179 the southernmost (Antarctica, mean
        +2810 m), column 0 the westernmost at about -180 degrees. Read them and plot them; no
        flipping or rolling is needed, and a week-3 student could not invent it. Built by
        tools/make_elevation_grids.py."
      resampling_note: >
        1 degree costs nothing the week needs. The fraction of Earth below sea level is 0.662 on
        the full 20-arcmin grid and 0.660 here; the bimodal shape is unchanged. 583,200 cells
        become 64,800 — still far more than a histogram needs, and a legible map. The full grid
        would put 15 MB into a repo that nbgitpuller clones onto 46 accounts.
      expect:
        # Measured on the SHIPPED grids, 250 m bins, this session.
        earth_peaks_m: [-4375, 125]      # abyssal plain and continents
        mars_peaks_m: [-4375, 1375]      # the hemispheric dichotomy
        earth_below_sea_level: 0.660
        earth_between_-5000_and_-3000: 0.347
        ranges_m: {earth: [-9026, 5824], mars: [-7682, 20708]}   # int16, so -9026.625 truncates
      verified: 2026-08-31
    exercise: "How FEW bins before the two peaks merge into one? Find that number for Earth and for Mars, and say which planet holds its two peaks longer. Then weight every cell by cos(latitude) and re-run: the fraction of Earth below sea level moves by about five points. Say which number is the honest one, and what the lon-lat grid was doing to the poles. Then switch containers and group the earthquake catalogue by year."
    note: >
      RESTORED. This question was lost when arrays and tables were merged, leaving the week with a
      statement about data structures rather than a science question.
      VERIFIED 2026-08-29 against both grids. Earth peaks at -4545 m and ~0 to +413 m; 66.1% of the
      surface lies below sea level, and 34.8% sits between -5000 and -3000 m. Those two humps are
      oceanic crust and continental crust — which is to say, THE DEEP PEAK IS THE OCEAN FLOOR, and
      the question is really why Earth has ocean basins at all.
      Mars peaks at -4235/-3870 m and +1240/+1605 m — also bimodal, but from the hemispheric
      dichotomy, whose origin is still debated. Same pattern, different cause, and the Mars half is
      an open research question. MOLA MEGDR 4 px/deg is 720x1440 and 2.07 MB.
      AUDITED 2026-08-30, and two defects were fixed. (1) THE BIN QUESTION WAS BACKWARDS. Both
      grids hold ~0.6-1.0 million cells, so Poisson noise never erases a mode: Earth stays bimodal
      from 6 bins to ~1000, and MARS STAYS BIMODAL PAST 20,000 BINS with no upper limit at all.
      The peaks merge only when bins are too FEW — Earth still shows two humps at 5 and merges at 4; Mars at 8. (Corrected 2026-08-31: this line read 'Earth at 5' as the merge point, which is off by one — measured, 5 bins give [159, 29036, 10627, 22351, 2627], which still has the dip. The notebook's answer of 5 as the FEWEST bins keeping two humps is right). Asked the old way,
      students hunt upward forever and conclude the exercise is broken.
      (2) "66% OF EARTH IS BELOW SEA LEVEL" IS A PROJECTION ARTIFACT. A lon-lat grid over-samples
      the poles, stretching Antarctica across many cells. Weighted by cos(latitude) the figure is
      71.1%, which IS the textbook ocean fraction; unweighted it is 66.1%, about five points wrong
      in the direction of a memorable round number. Peak POSITIONS are unaffected (-4450/+150 m
      either way), so the bimodality science survives — only the percentage lies. The weighting is
      one new idea (a weights argument to plt.hist) and turns the trap into the best moment of the
      week: the map lied and the cosine fixed it.
      READ RECIPE, verified: ETOPO20 is plain ASCII, np.loadtxt gives (540, 1081) — column 1080
      duplicates column 0, so trim it. MOLA MEGDR needs dtype ">i2" (BIG-endian int16); the
      native-endian read returns -32768..32767 and an unmistakably garbage map, which is the good
      kind of failure. Both load in under 0.05 s with numpy alone.
      Quote a modal position only with its bin width: the Earth deep peak moves -4297 m at 50 bins
      to -5022 m at 200. At 20 arc-min the grid is averaged, so its extremes are NOT Earth's
      (-9027 m against Challenger Deep -10,900 m).
      NOTE ON A FAILED ALTERNATIVE: seafloor depth against sqrt(age) was tested as an ocean
      question and rejected. Binned means show the classic shape (-3063 m at 2.5 Ma to -4348 m at
      47 Ma, then flattening), but on raw points the transformation barely helps — r moves only
      from -0.468 to -0.494, and the fit gives -206*sqrt(age) against a textbook -350. Too much
      scatter from seamounts and sediment.
    takeaways:
      - "Earth's surface has two levels — ocean floor and continent. Mars has two as well, for a different reason nobody has settled."
      - "A histogram's bin count can hide the science: too few bins merge real peaks."
      - "A longitude-latitude grid over-counts the poles, so area-weight before quoting any percentage."
  - n: 4
    date: 2026-09-28
    slug: 04_where_and_why
    evidence: [notes/dataset-audit/usgs-fdsn.md, notes/dataset-audit/gvp-volcanoes.md, notes/dataset-audit/plate-boundaries.md]
    modules: [D4, D5]
    field: seismology / volcanology
    question: "Where do earthquakes and volcanoes happen — and why there?"

    pinned:
      slice: "Smithsonian GVP Holocene eruptions — 11,089 dated, VEI 0-7"
      constants:
        vei: {tambora: 7, st_helens: 5}   # logarithmic: a hundredfold in erupted volume
        earthquake_energy: "log10 E = 1.5M + 4.8 — an M9 releases ~32,000x an M6"
      verified: 2026-08-30
    exercise: "Colour the earthquakes by depth, then overlay the trenches. Say where the deep events are and why they sit where they do — you are looking at subducting slabs."
    note: >
      VEI is logarithmic like magnitude: Tambora is VEI 7, St Helens VEI 5 — a hundredfold in
      erupted volume. Needs a function (P4) to convert an index to a physical quantity, and log
      axes (D4) or the plot is unreadable. VERIFIED against Smithsonian GVP: 11,089 dated Holocene
      eruptions, VEI 0-7. The extension does the same for earthquake energy
      (log10 E = 1.5M + 4.8; an M9 releases ~32,000x an M6).

    takeaways:
      - "Earthquakes and volcanoes sit on plate boundaries; the deep earthquakes sit behind the trenches, on subducting slabs."
      - "A map is a scatter plot of longitude against latitude — no map library required."
      - "Magnitude and VEI are both logarithmic, so plot them on log axes or the figure lies."
  - n: 5
    date: 2026-10-05
    slug: 05_clustered_or_random
    evidence: [notes/dataset-audit/usgs-fdsn.md]
    modules: [S2]
    field: seismology
    question: "Do earthquakes cluster — or is that just what randomness looks like?"

    pinned:
      slice: "global M5.5+, starttime=2000-01-01 endtime=2026-01-01 — 12,849 events over 26 years"
      expect:
        busiest_real_day: {date: 2011-03-11, events: 128}    # Tohoku
        busiest_simulated_day: {mean: 7.64, p95: 9}
        excess_over_chance: 16.7
      verified: 2026-08-30
    exercise: "Now the forecast: count M6+ near Berkeley, get a rate, and use Poisson for the chance of one during your four years here. Report a single number — week 8 will make you regret that."
    note: >
      REPLACES a forecast question that could not be answered yet: a rate for rare magnitudes
      needs Gutenberg-Richter (week 7) and an interval needs the bootstrap (week 8), so week 5
      could only fudge it by counting. This question needs probability ALONE.
      RE-AUDITED 2026-08-30 and CORRECTED — the earlier figure of 81 was wrong and could not be
      reproduced under any timezone or magnitude cut. Global M5.5+ 2000-2026 (12,849 events over 26
      years, endtime=2026-01-01): the busiest real day holds 128 events, on 2011-03-11 — Tohoku.
      Simulating random times at the same rate gives a busiest day of 7.64 on average (95th
      percentile 9). TWO lessons in one figure — randomness is ALREADY clumpy, so "it looks
      clustered" proves nothing; and real seismicity exceeds chance by 16.7x, which is aftershocks,
      i.e. physics. The busiest day being a date students may recognise is a bonus, not a problem.
      Sets up three later things: Omori in week 7, DBSCAN in week 12, and project track T1, whose
      entire punchline is that aftershocks violate the independence a chi-squared test assumes.
    takeaways:
