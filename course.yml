      expect:
        accuracy: {all_51_columns: 0.965, ten_major_oxides: 0.921, majority_baseline: 0.343}
        blanks_alone: 0.868              # a forest given ONLY the pattern of missingness
        sparse_columns_alone: 0.811      # the 19 columns that are over half empty
        most_complete_column: "Sr, 6.5% missing — no column in the file is complete"
        dropna_on_all_51: 1              # rows left. The lesson is DELETION, not dimensionality.
        # The Ti-V pair, dropna against median-filled. ONE SEED IS NOT ENOUGH HERE, and the first
        # build said it was: seed 0 gives 0.832 against 0.727, but over ten splits the dropna tree
        # averages 0.780 and the filled tree 0.726 — a mean gap of 0.054 that falls to 0.001 on
